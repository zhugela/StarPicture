# 本地开发 profile（MySQL root + ShardingSphere）
# 启动：--spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  shardingsphere:
    mode:
      type: Standalone
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/starpicture?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8&useUnicode=true&allowPublicKeyRetrieval=true
        username: root
        password: ${MYSQL_PASSWORD:CHANGE_ME}
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: ds0.picture
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: STANDARD
              algorithmClassName: com.yu.backend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true

cos:
  client:
    host: ${COS_HOST:https://your-bucket.cos.ap-guangzhou.myqcloud.com}
    secretId: ${COS_SECRET_ID:CHANGE_ME}
    secretKey: ${COS_SECRET_KEY:CHANGE_ME}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:your-bucket}
    simple-upload-only: true

aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:CHANGE_ME}

auth:
  jwt:
    secret: star-picture-local-jwt-secret
    expire-days: 30

wx:
  mp:
    enabled: true
    app-id: ${WX_MP_APP_ID:}
    app-secret: ${WX_MP_APP_SECRET:}
    token: starpicture

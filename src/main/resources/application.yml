server:
  port: 8123
  servlet:
    context-path: /api

spring:
  application:
    name: backend2
  profiles:
    active: local
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
redis:
  database: 3
  host: 127.0.0.1
  port: 6379
  timeout: 5000

# 微信小程序（app-secret 请在 application-local.yml 或环境变量配置）
wx:
  miniapp:
    app-id: wxcc006e978973a40b
    app-secret: ''
    token-secret: star-picture-jwt-secret-change-me
    token-expire-days: 30
  # 微信公众号（与小程序共用后端；AppID/AppSecret 为公众号凭证，非小程序）
  mp:
    enabled: true
    app-id: ''
    app-secret: ''
    token: starpicture
    subscribe-reply: |
      欢迎关注内娱图库！
      回复「图库」或「帮助」获取说明，也可点击菜单进入小程序。
    default-reply: 感谢留言！回复「图库」或「帮助」，或点击底部菜单打开小程序。
    # keyword-reply 使用 WxMpProperties 内默认值，避免 YAML 多行块绑定 Map 失败

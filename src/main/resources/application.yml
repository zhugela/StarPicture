server:
  port: 8123
  servlet:
    context-path: /api

spring:
  application:
    name: backend2
  # 服务器 jar 默认 prod；本地开发请加：--spring.profiles.active=local
  profiles:
    active: prod
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
redis:
  database: 3
  host: 127.0.0.1
  port: 6379
  timeout: 5000

auth:
  jwt:
    secret: star-picture-jwt-secret-change-me
    expire-days: 30

# 微信公众号（AppID/AppSecret 为公众号凭证）
wx:
  mp:
    enabled: true
    app-id: ''
    app-secret: ''
    token: starpicture
    subscribe-reply: |
      欢迎关注内娱图库！
      回复「图库」或「帮助」获取使用说明。
    default-reply: 感谢留言！回复「图库」或「帮助」获取更多信息。
    # keyword-reply 使用 WxMpProperties 内默认值，避免 YAML 多行块绑定 Map 失败

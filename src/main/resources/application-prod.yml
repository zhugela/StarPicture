# 生产环境（ShardingSphere 数据源 + 动态分表，勿与 spring.datasource 混用）
server:
  port: 8123

spring:
  shardingsphere:
    mode:
      type: Standalone
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://43.139.218.240:3306/starpicture?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&useUnicode=true&allowPublicKeyRetrieval=true
        username: starpicture
        password: ${MYSQL_PASSWORD:CHANGE_ME}
        minimum-idle: 5
        maximum-pool-size: 20
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: ds0.picture
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: STANDARD
              algorithmClassName: com.yu.backend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: false
  redis:
    database: 0
    host: 43.139.218.240
    port: 6379
    timeout: 5000
    password: ${REDIS_PASSWORD:}
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

knife4j:
  basic:
    enable: true
    username: root
    password: ${KNIFE4J_PASSWORD:CHANGE_ME}

cos:
  client:
    host: ${COS_HOST:https://your-bucket.cos.ap-guangzhou.myqcloud.com}
    secretId: ${COS_SECRET_ID:CHANGE_ME}
    secretKey: ${COS_SECRET_KEY:CHANGE_ME}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:your-bucket}
    simple-upload-only: true

aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:CHANGE_ME}

wx:
  mp:
    enabled: false
